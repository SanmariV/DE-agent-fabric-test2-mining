[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde"
version = "0.1.0"
description = "Fabric data engineering toolkit: specs -> silver notebooks, gold procedures, tests."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
fabric = ["pyodbc>=5.0", "azure-identity>=1.17", "fabric-cicd>=0.1.20"]
matrix = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "sqlglot>=25.0"]

[project.scripts]
fde = "fde.__main__:main"

[tool.setuptools]
packages = ["fde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
