description: >
  One row per source publication or website that backs the facility and
  production records. Grain = DataSource_BK. The source is a single static
  snapshot, so attributes are overwritten, not versioned.
scd_type: 1
meta:
  matrix:
    business_question: Why
    scd_type: 1
columns:
  - name: DataSource_BK
    data_type: varchar(20)
    business_key: true
    description: Unique ID for each source.
  - name: SourceName
    data_type: varchar(500)
    description: Names of the source publications or websites.
  - name: SourceUrl
    data_type: varchar(1000)
    description: URLs of the source publications or websites.
tests:
  - row_count_between: {min: 1, severity: warn}
