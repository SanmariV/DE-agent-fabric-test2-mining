description: >
  One row per commodity contained in a mineral stream of a facility and year.
  Grain = CommodityProduction_BK (source row id).
source: {source: dbo, table: commodities}
load: {mode: full}
columns:
  - name: CommodityProduction_BK
    data_type: int
    expression: cast(id as int)
    business_key: true
    description: Unique ID for each row, running integer.
  - name: Facility_BK
    data_type: string
    expression: upper(trim(facility_id))
    description: Facility producing the commodity; key of Facility.
  - name: Material_BK
    data_type: string
    expression: upper(trim(material))
    description: Mineral the commodity is contained in; key of Material.
  - name: CommodityMaterial_BK
    data_type: string
    expression: upper(trim(commodity))
    description: Commodity the stream relates to; key of Material.
  - name: MineralProduction_BK
    data_type: int
    expression: cast(id_minerals as int)
    description: >
      Row of MineralProduction this commodity row was derived from. Null for
      2,373 of 9,426 rows (no mineral row linked); every non-null value matches
      a MineralProduction row of the same facility, year and material.
    tests:
      - relationships: {to: dbo.MineralProduction, field: MineralProduction_BK}
  - name: DataSource_BK
    data_type: string
    expression: upper(trim(source_id))
    description: Source of the record; key of DataSource.
  - name: MineProcessing
    data_type: string
    expression: trim(mine_processing)
    description: Type of leaching conducted at the mine, if any.
  - name: ReportingPeriod
    data_type: string
    expression: coalesce(trim(reporting_period), 'January-December')
    description: >
      Period in which the stream occurred. Always relates to the year in which
      the period ends. January-December when not specified in the source.
  - name: Comment
    data_type: string
    expression: trim(comment)
    description: Free-text comment.
  - name: ValueTonnes
    data_type: decimal(18,4)
    expression: cast(value_tonnes as decimal(18,4))
    description: Mass of the commodity, in tonnes.
  - name: GradePartsPerMillion
    data_type: decimal(18,4)
    expression: cast(grade_ppm as decimal(18,4))
    description: Grade of the material relating to the stated commodity, in parts per million.
  - name: RecoveryRate
    data_type: decimal(18,6)
    expression: cast(recovery_rate as decimal(18,6))
    description: Share of output material recovered from the output material contained in the input material.
  - name: YieldPartsPerMillion
    data_type: decimal(18,4)
    expression: cast(yield_ppm as decimal(18,4))
    description: Grade relating to the commodity multiplied by the recovery rate, in parts per million.
  - name: AmountSoldTonnes
    data_type: decimal(18,4)
    expression: cast(amount_sold_tonnes as decimal(18,4))
    description: Mass of output material sold, in tonnes.
  - name: MetalPayableTonnes
    data_type: decimal(18,4)
    expression: cast(metal_payable_tonnes as decimal(18,4))
    description: >
      Mass of output material contained in the input material after a share
      specified by the facility operator is deducted, in tonnes.
  - name: ReportingYear
    data_type: int
    expression: cast(year as int)
    description: Year in which the reporting period ends.
    tests:
      - accepted_range: {min: 1990, max: 2030}
