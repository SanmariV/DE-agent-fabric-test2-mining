# Pull request checks. Offline: no Fabric connection or secret needed.
# Deploying to test/prod is a separate release pipeline (standards,
# section 9.4); it runs `python -m fde deploy --target <env>` as the CI
# service principal with FDE_ALLOW_PROTECTED=1.
name: fde-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,matrix]"
      - name: Specs load
        run: python -m fde parse
      - name: Project rules and render drift
        run: python -m fde check
      - name: Toolkit tests
        run: python -m pytest -q
